<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blk - Launcher</title>
<style>
  :root {
    --bg: #000000; --panel: #0c0c0c; --panel2: #161616; --line: #262626;
    --text: #ffffff; --muted: #9aa0aa; --accent: #5b9dff; --ok: #3fb950;
    --fail: #f85149; --run: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 400px 6px 1fr; gap: 0; height: calc(100vh - 61px); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; height: auto; } .splitter { display: none; } }
  .cards { overflow-y: auto; padding: 14px; min-width: 0; min-height: 0; }
  .splitter { cursor: col-resize; background: var(--line); }
  .splitter:hover, .splitter.dragging { background: var(--accent); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .card.active { border-color: var(--accent); }
  .card h2 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .card .desc { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
  .dot.running { background: var(--run); animation: pulse 1.1s infinite; }
  .dot.ok { background: var(--ok); }
  .dot.failed { background: var(--fail); }
  .dot.stopped { background: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .opts {
    display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px;
    align-items: center; font-size: 12px; color: var(--muted);
  }
  .opts label { display: flex; align-items: center; gap: 5px; }
  select {
    font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  button {
    font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button.stop { color: var(--fail); }
  .links { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .links:empty, .qr:empty { display: none; }
  .links a {
    color: var(--accent); text-decoration: none; font-size: 13px;
    font-family: ui-monospace, monospace; word-break: break-all;
  }
  .links a:hover { text-decoration: underline; }
  .links .lbl { color: var(--muted); font-family: inherit; margin-right: 6px; }
  .qr { margin-top: 12px; }
  .qr svg { width: 168px; height: 168px; display: block; background: #fff; padding: 8px; border-radius: 8px; }
  .qr .cap { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .console { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 10px 14px 0; flex-wrap: wrap; }
  .tab {
    padding: 6px 12px; border: 1px solid var(--line); border-bottom: none;
    border-radius: 8px 8px 0 0; background: var(--panel2); color: var(--muted);
    cursor: pointer; font-size: 13px;
  }
  .tab.active { background: var(--panel); color: var(--text); }
  pre.log {
    flex: 1; min-height: 0; margin: 0; padding: 14px 16px; overflow: auto; background: #000;
    border-top: 1px solid var(--line);
    font: 12.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre;
  }
  .log .cmd { color: var(--accent); }
  .progress-bar {
    padding: 8px 16px; background: #000; border-top: 1px solid var(--line);
    font: 12.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--run); white-space: pre; overflow-x: auto; min-height: 1.5em;
  }
  .progress-bar:empty { display: none; }
  .empty { color: var(--muted); padding: 40px 16px; }
  .ctx {
    position: fixed; z-index: 10; display: none; min-width: 170px; padding: 4px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.6);
  }
  .ctx div { padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  .ctx div:hover { background: var(--accent); color: #000; }
  .ctx div.off { color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>blk launcher</h1>
  <span class="sub">build &amp; run the editor and the web viewer</span>
</header>
<main>
  <section class="cards" id="cards"></section>
  <div class="splitter" id="splitter"></div>
  <section class="console">
    <div class="tabs" id="tabs"></div>
    <pre class="log" id="log"><span class="empty">Pick an action to see build output here.</span></pre>
    <div class="progress-bar" id="progress"></div>
  </section>
</main>
<div class="ctx" id="ctx">
  <div id="ctx-sel">Copy selection</div>
  <div id="ctx-all">Copy all output</div>
  <div id="ctx-clear">Clear view</div>
</div>
<script>
const TITLES = { native: 'Native editor', web: 'Web viewer' };
const DESCS = {
  native: 'blaise.sln (MSBuild) -> blaise.exe',
  web: 'Emscripten -> build_wasm/, served on :8080',
};
const LABELS = {
  build: 'Build', run: 'Run', build_run: 'Build & Run',
  build_serve: 'Build & Serve', serve: 'Serve', tunnel: 'Tunnel',
};
const state = {};      // target -> { status, links: {label:url}, qr, log: [ {text,cmd} ], live }
let active = null;     // currently shown tab
const streams = {};    // target -> EventSource
let config = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

function ensure(name) {
  if (!state[name]) state[name] = { status: null, links: {}, qr: null, log: [], live: null };
  return state[name];
}

// Remembered per-viewer option values (config, level, ...), keyed by control id.
function saved(id, fallback) {
  try { return localStorage.getItem('opt_' + id) ?? fallback; } catch (e) { return fallback; }
}
function save(id, value) {
  try { localStorage.setItem('opt_' + id, value); } catch (e) {}
}

function select(id, values, current) {
  const opts = values.map(v =>
    `<option value="${v}"${v === current ? ' selected' : ''}>${v || '(none)'}</option>`).join('');
  return `<select id="${id}" onchange="save('${id}', this.value)">${opts}</select>`;
}

function check(id, label) {
  return `<label><input type="checkbox" id="${id}" ${saved(id, '') === '1' ? 'checked' : ''}
    onchange="save('${id}', this.checked ? '1' : '')">${label}</label>`;
}

function optsHtml(target) {
  if (target === 'native') {
    return `<label>config ${select('config', config.configs, saved('config', 'Release'))}</label>`;
  }
  const lvl = saved('level', config.default_level);
  const levels = config.levels.includes(lvl) ? config.levels : [config.default_level, ...config.levels];
  return `
    <label>level ${select('level', levels, config.levels.includes(lvl) ? lvl : config.default_level)}</label>
    <label>backend ${select('backend', config.backends, saved('backend', config.backends[0]))}</label>
    ${check('symbols', 'symbols')}
    ${check('asan', 'asan')}`;
}

function collectOpts(target) {
  const v = id => document.getElementById(id)?.value;
  const c = id => !!document.getElementById(id)?.checked;
  if (target === 'native') return { config: v('config') };
  return { level: v('level'), backend: v('backend'), symbols: c('symbols'), asan: c('asan') };
}

async function init() {
  config = await api('/api/config');
  const host = document.getElementById('cards');
  for (const target of Object.keys(config.targets)) {
    ensure(target);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + target;
    const buttons = config.targets[target]
      .map(a => `<button onclick="act('${target}','${a}')">${LABELS[a]}</button>`).join('');
    card.innerHTML = `
      <h2 onclick="show('${target}')"><span class="dot" id="dot-${target}"></span>${TITLES[target]}</h2>
      <div class="desc">${DESCS[target]}</div>
      <div class="opts">${optsHtml(target)}</div>
      <div class="btns">${buttons}<button class="stop" onclick="stop('${target}')">Stop</button></div>
      <div class="links" id="links-${target}"></div>
      <div class="qr" id="qr-${target}"></div>`;
    host.appendChild(card);
  }
  // re-attach to anything already running (survives page reloads)
  const st = await api('/api/state');
  let first = null;
  for (const name in st) {
    ensure(name).status = st[name].status;
    renderStatus(name);
    if (st[name].status === 'running') { attach(name); first = first || name; }
  }
  active = first || Object.keys(config.targets)[0];
  show(active);
}

async function act(name, action) {
  const s = ensure(name);
  s.log = []; s.links = {}; s.qr = null; s.live = null; s.status = 'running';
  renderLinks(name); renderQr(name); renderStatus(name);
  show(name);
  const r = await api('/api/action', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ target: name, action, opts: collectOpts(name) }),
  });
  if (r.error) {
    s.status = 'failed'; renderStatus(name);
    s.log.push({ text: 'launcher: ' + r.error }); appendCommitted('launcher: ' + r.error);
    return;
  }
  attach(name);
}

async function stop(name) {
  await api('/api/stop', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ target: name }),
  });
}

function attach(name) {
  if (streams[name]) streams[name].close();
  const es = new EventSource('/api/events?job=' + encodeURIComponent(name));
  streams[name] = es;
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    const s = ensure(name);
    if (ev.type === 'log') {
      if (ev.transient) {
        s.live = ev.line;                 // an in-place progress-bar redraw
        if (active === name) renderLive(name);
      } else {
        s.log.push({ text: ev.line });
        if (s.log.length > MAX_LINES * 2) s.log.splice(0, s.log.length - MAX_LINES);
        if (active === name) appendCommitted(ev.line);
      }
    } else if (ev.type === 'status') {
      s.status = ev.status; renderStatus(name);
      if (ev.status !== 'running') {
        s.live = null;
        if (active === name) renderLive(name);
        es.close(); delete streams[name];
        // Links/QR point at a server that's no longer running -- clear them.
        s.links = {}; s.qr = null;
        renderLinks(name); renderQr(name);
      }
    } else if (ev.type === 'url') {
      s.links[ev.label] = ev.url; renderLinks(name);
    } else if (ev.type === 'qr') {
      s.qr = ev.svg; renderQr(name);
    }
  };
  es.onerror = () => { es.close(); delete streams[name]; };
}

function renderStatus(name) {
  const dot = document.getElementById('dot-' + name);
  if (dot) dot.className = 'dot ' + (ensure(name).status || '');
  const card = document.getElementById('card-' + name);
  if (card) card.classList.toggle('active', ensure(name).status === 'running');
}

function renderLinks(name) {
  const host = document.getElementById('links-' + name);
  if (!host) return;
  host.innerHTML = Object.entries(ensure(name).links)
    .map(([lbl, url]) => `<a href="${url}" target="_blank"><span class="lbl">${lbl}</span>${url}</a>`)
    .join('');
}

function renderQr(name) {
  const host = document.getElementById('qr-' + name);
  if (!host) return;
  const svg = ensure(name).qr;
  host.innerHTML = svg ? svg + '<div class="cap">scan to open on your phone</div>' : '';
}

function renderTabs() {
  const host = document.getElementById('tabs');
  host.innerHTML = '';
  for (const name in state) {
    const t = document.createElement('div');
    t.className = 'tab' + (active === name ? ' active' : '');
    t.textContent = TITLES[name];
    t.onclick = () => show(name);
    host.appendChild(t);
  }
}

function show(name) {
  active = name;
  renderTabs();
  const log = document.getElementById('log');
  const s = ensure(name);
  if (!s.log.length && s.live == null) {
    log.innerHTML = '<span class="empty">No output yet for ' + TITLES[name] + '.</span>';
    renderLive(name);
    return;
  }
  pending = [];
  log.innerHTML = '';
  log.appendChild(makeLines(s.log.slice(-MAX_LINES).map(l => l.text)));
  log.scrollTop = log.scrollHeight;
  renderLive(name);
}

// Only auto-scroll if already at (or near) the bottom, so scrolling up to read
// earlier output doesn't get yanked back down.
function isNearBottom(log) {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
}

// A wasm build emits 100k+ lines (compiler warnings), so lines are queued and
// flushed in one DOM update per tick, and the log is capped -- appending each
// line with its own layout read froze the page.
const MAX_LINES = 5000;
let pending = [];
let flushTimer = null;

function makeLines(texts) {
  const frag = document.createDocumentFragment();
  for (const text of texts) {
    const span = document.createElement('span');
    if (text.startsWith('$ ')) span.className = 'cmd';
    span.textContent = text + '\n';
    frag.appendChild(span);
  }
  return frag;
}

function appendCommitted(text) {
  pending.push(text);
  if (!flushTimer) flushTimer = setTimeout(flushLines, 60);
}

function flushLines() {
  flushTimer = null;
  const texts = pending; pending = [];
  if (!texts.length) return;
  const log = document.getElementById('log');
  const stick = isNearBottom(log);
  const empty = log.querySelector('.empty');
  if (empty) log.innerHTML = '';
  log.appendChild(makeLines(texts.length > MAX_LINES ? texts.slice(-MAX_LINES) : texts));
  while (log.childElementCount > MAX_LINES) log.removeChild(log.firstChild);
  if (stick) log.scrollTop = log.scrollHeight;
}

function renderLive(name) {
  const s = ensure(name);
  document.getElementById('progress').textContent = s.live ? s.live + '\n' : '';
}

// Right-click the log: copy the selection, the whole log, or clear the view.
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch (e) {}
  const ta = document.createElement('textarea');   // fallback for non-secure contexts
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
}

(function initContextMenu() {
  const log = document.getElementById('log');
  const menu = document.getElementById('ctx');
  const sel = document.getElementById('ctx-sel');
  let selected = '';
  const hide = () => { menu.style.display = 'none'; };

  log.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    selected = String(window.getSelection());
    sel.classList.toggle('off', !selected);
    menu.style.display = 'block';
    menu.style.left = Math.min(e.clientX, innerWidth - menu.offsetWidth - 4) + 'px';
    menu.style.top = Math.min(e.clientY, innerHeight - menu.offsetHeight - 4) + 'px';
  });
  sel.onclick = () => { if (selected) copyText(selected); hide(); };
  document.getElementById('ctx-all').onclick = () => {
    const s = ensure(active);
    copyText(s.log.map(l => l.text).join('\n') + (s.live ? '\n' + s.live : ''));
    hide();
  };
  document.getElementById('ctx-clear').onclick = () => {
    const s = ensure(active);
    s.log = []; s.live = null; show(active); hide();
  };
  window.addEventListener('click', hide);
  window.addEventListener('blur', hide);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
})();

(function initSplitter() {
  const main = document.querySelector('main');
  const splitter = document.getElementById('splitter');
  try {
    const savedWidth = localStorage.getItem('splitWidth');
    if (savedWidth) main.style.gridTemplateColumns = savedWidth + 'px 6px 1fr';
  } catch (e) {}

  let dragging = false;
  splitter.addEventListener('mousedown', (e) => {
    dragging = true;
    splitter.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    const width = Math.min(Math.max(e.clientX - rect.left, 200), rect.width - 200);
    main.style.gridTemplateColumns = width + 'px 6px 1fr';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.style.userSelect = '';
    try { localStorage.setItem('splitWidth', parseInt(main.style.gridTemplateColumns, 10)); } catch (e) {}
  });
})();

init();
</script>
</body>
</html>
