<!doctype html>
<!-- shell.html - Emscripten page shell for the web viewer spike. 2026 blk -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>blk_engine viewer</title>
		<style>
			:root { color-scheme: dark; }
			body {
				margin: 0;
				background: #14161a;
				color: #d7dae0;
				font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				padding: 16px;
			}
			h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
			canvas { background: #000; border: 1px solid #2a2f37; max-width: 100%; }
			#log {
				width: min(1280px, 100%);
				height: 180px;
				overflow-y: auto;
				background: #0e1013;
				border: 1px solid #2a2f37;
				padding: 8px 10px;
				white-space: pre-wrap;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h1>blk_engine &mdash; web viewer spike (null renderer)</h1>
		<canvas id="canvas" width="1280" height="720" tabindex="-1"></canvas>
		<div id="log"></div>

		<script>
			const logEl = document.getElementById('log');
			const append = (text) => {
				logEl.textContent += text + '\n';
				logEl.scrollTop = logEl.scrollHeight;
			};

			var Module = {
				canvas: document.getElementById('canvas'),
				print: append,
				printErr: append,
			};
		</script>
		{{{ SCRIPT }}}
	</body>
</html>
